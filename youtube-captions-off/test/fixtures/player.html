<!doctype html>
<html>
<head><meta charset="utf-8"><title>mock player</title>
<script>
  // YouTube はページの読み込み時に、広告データ入りの動画情報をこの変数に埋め込む
  var ytInitialPlayerResponse = { videoDetails: { videoId: 'v1' }, adPlacements: [{}], adSlots: [{}], playerAds: [{}] };
</script>
</head>
<body>
<div id="movie_player" class="html5-video-player"></div>
<script>
// YouTube の字幕モジュール（iOS Safari の HLS 再生時）の動きを再現した模擬プレイヤー。
// 実コードの挙動：
//  - 字幕ごとに <track kind="subtitles" id=... src=...vtt> を video に追加し、選択中のものに default を付ける
//  - video.textTracks の change を監視し、showing のトラックがあればそれをプレイヤーの字幕に、なければ字幕オフにする
//  - プレイヤーの字幕がオンなら、DOM の字幕レイヤーに文字を描く
window.mock = {
  playerTrack: null,   // プレイヤー側の字幕状態。null = オフ
  changeEvents: 0,
  sawShowing: 0,       // 字幕トラックが一度でも showing になった回数
  lateListener: false, // true: change の監視を loadedmetadata まで遅らせ、その時点で字幕オンを再適用する
  log: [],
  video: null,

  attach(video) {
    if (this.video === video) return;
    this.video = video;
    const listen = () => video.textTracks.addEventListener('change', () => {
      this.changeEvents++;
      let showing = null;
      for (const t of video.textTracks) {
        if (t.kind !== 'subtitles') continue;
        if (t.mode === 'showing') { showing = t.id; this.sawShowing++; }
      }
      this.playerTrack = showing;
      this.renderDomCaption();
    });
    if (!this.lateListener) return listen();
    video.addEventListener('loadedmetadata', () => {
      if (!this.listening) { this.listening = true; listen(); }
      // 字幕設定の復元などで、トラックに触れずにプレイヤーだけ字幕オンに戻す
      this.playerTrack = this.currentId + '.ja';
      this.renderDomCaption();
    });
  },

  createVideo() {
    const v = document.createElement('video');
    v.className = 'html5-main-video';
    v.muted = false; // 利用者は音ありで見ている
    v.playsInline = true;
    document.getElementById('movie_player').appendChild(v);
    this.attach(v);
    return v;
  },

  replaceVideo() {
    if (this.video) this.video.remove();
    this.video = null;
    return this.createVideo();
  },

  // SPA 遷移：同じ video 要素で次の動画を読み込む
  loadVideo(videoId) {
    const v = this.video;
    this.currentId = videoId;
    v.querySelectorAll('track').forEach((t) => t.remove());
    v.src = 'clip.webm?v=' + videoId;
    for (const lang of ['en', 'ja']) {
      const tr = document.createElement('track');
      tr.setAttribute('kind', 'subtitles');
      tr.setAttribute('label', lang);
      tr.setAttribute('srclang', lang);
      tr.setAttribute('id', videoId + '.' + lang);
      tr.setAttribute('src', 'subs.vtt?v=' + videoId + '&lang=' + lang);
      if (lang === 'ja') tr.setAttribute('default', '1'); // 字幕が勝手にオンになる状態
      v.appendChild(tr);
    }
    // 字幕以外のトラック。字幕オフの対象にしてはいけない
    const meta = v.addTextTrack('metadata', 'id3');
    meta.mode = 'hidden';
    // プレイヤーは字幕オンのつもりで DOM の字幕も描く
    this.playerTrack = videoId + '.ja';
    this.renderDomCaption();
  },

  // 動画広告：プレイヤーに ad-showing を付け、広告動画を流す。広告が最後まで再生されたら本編に戻る
  adEnded: false,
  skipClicks: 0,
  playAd({ longStream = false, skipButton = false, noSeek = false } = {}) {
    const player = document.getElementById('movie_player');
    const v = this.video;
    this.adEnded = false;
    player.classList.add('ad-showing');
    const ui = document.createElement('div');
    ui.className = 'ytp-ad-module';
    ui.innerHTML = '<div class="ytp-ad-overlay-container">バナー広告</div>';
    if (skipButton) {
      const b = document.createElement('button');
      b.className = 'ytp-skip-ad-button';
      b.addEventListener('click', () => { this.skipClicks++; this.endAd(); });
      ui.appendChild(b);
    }
    player.appendChild(ui);
    if (longStream) {
      // 本編と一体で配信される長い動画を再現
      Object.defineProperty(v, 'duration', { configurable: true, get: () => 3600 });
    }
    v.onended = () => this.endAd();
    // 本編と一体の配信は動画を差し替えない
    if (!longStream) v.src = 'clip.webm?ad=1' + (noSeek ? '&noseek=1' : '');
    v.play().catch(() => {});
  },
  endAd() {
    const player = document.getElementById('movie_player');
    if (!player.classList.contains('ad-showing')) return;
    player.classList.remove('ad-showing');
    player.querySelectorAll('.ytp-ad-module').forEach((e) => e.remove());
    delete this.video.duration;
    this.video.onended = null;
    this.adEnded = true;
  },

  renderDomCaption() {
    document.querySelectorAll('.ytp-caption-window-container').forEach((e) => e.remove());
    if (!this.playerTrack) return;
    const c = document.createElement('div');
    c.className = 'ytp-caption-window-container';
    c.innerHTML =
      '<div class="caption-window ytp-caption-window-bottom"><span class="captions-text">' +
      '<span class="ytp-caption-segment">字幕テキスト</span></span></div>';
    document.getElementById('movie_player').appendChild(c);
  },
};
</script>
</body>
</html>
